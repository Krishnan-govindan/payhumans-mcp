startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      agentApiKey:
        type: string
        title: Pay Humans API Key
        description: >
          Your agent API key (starts with ph_). You can call the agents.register
          tool without a key to get one free with $50 in credits.
    required: []
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        AGENT_API_KEY: config.agentApiKey ?? ""
      }
    })
